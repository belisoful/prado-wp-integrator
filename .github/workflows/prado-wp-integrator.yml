name: PRADO WP Integrator
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prado_version:
        description: 'PRADO constraint to test against, e.g. 4.4.x-dev for the current branch head'
        required: false
        default: ''

# composer.json takes any PRADO from the 4.3 line up, so a plain install floats
# with the framework. CI pins one build instead, and only moves when this value
# does. Bump it (and re-run the tests) to adopt a newer framework build.
env:
  PRADO_VERSION: '4.4.x-dev#6160b68d2d65efa7d5153f644ab7ee31bd67851a'

jobs:
  wpintegrator:
    name: PRADO WP Integrator
    runs-on: ubuntu-latest
    services:
      memcached:
        image: memcached
        ports:
          - 11211:11211
      postgres:
        image: postgres
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: ctype, dom, intl, json, mbstring, memcached, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, openssl, pcre, spl, zlib
          tools: php-cs-fixer, phpstan, cs2pr

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Validate code syntax using php-cs-fixer
        run: php-cs-fixer fix -vvv --dry-run --using-cache=no --format=checkstyle | cs2pr

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}-${{ inputs.prado_version || env.PRADO_VERSION }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Pin PRADO to the build under test
        run: composer require --no-update pradosoft/prado:"${{ inputs.prado_version || env.PRADO_VERSION }}"

      - name: Install Composer dependencies
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - name: Validate code using phpstan
        run: phpstan analyse --memory-limit=1G --error-format=checkstyle | cs2pr

      - name: Run Unit Tests
        run: |
          composer unittest



